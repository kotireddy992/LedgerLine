# Used by unit tests only (no DB connection needed for Mockito tests).
# Integration tests override these via @DynamicPropertySource.
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false
app.jwt.secret=testSecretKeyForJwtThatIsAtLeast64CharactersLongForHS512AlgorithmUsage1234
app.jwt.expiration-ms=3600000
