# ── Application ──────────────────────────────────────────────────────────────
spring.application.name=LedgerLine

# ── DataSource ────────────────────────────────────────────────────────────────
# Override DB_URL / DB_USER / DB_PASS via environment variables in production.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ledgerline_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ───────────────────────────────────────────────────────────────────────
# Flyway owns the schema — Hibernate must NOT auto-create or alter tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ── JWT ───────────────────────────────────────────────────────────────────────
# MUST be overridden in production via JWT_SECRET env variable.
# Minimum 512 bits (64 chars) for HS512.
app.jwt.secret=${JWT_SECRET:3f8a2b1c9d4e7f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ── Currency ──────────────────────────────────────────────────────────────────
# All monetary values stored with scale=2, rounding=HALF_EVEN (banker's rounding).
app.currency.default=INR
app.currency.scale=2
