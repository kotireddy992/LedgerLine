version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: ledgerline_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ledgerline_db
    ports:
      - "3306:3306"
    volumes:
      - ledgerline_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ledgerline_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ledgerline_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASS: root
      JWT_SECRET: change_this_to_a_64_char_minimum_secret_in_production_env_variable
      JWT_EXPIRATION_MS: 86400000
    ports:
      - "8080:8080"

volumes:
  ledgerline_mysql_data:
